<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fully transparent page background */
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            padding: 20px;
            color: #1e293b;
        }

        .construction-box {
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            line-height: 1.6;
            max-width: 600px;
            padding: 30px;
            /* Semi-transparent backdrop for text readability regardless of underlying frame/background */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 600px) {
            .construction-box {
                font-size: 1.2rem;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="construction-box">
        Under Construction - to be completed and updated soon. Thank you.
    </div>

</body>
</html>
