<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>மரக்கன்றுகள் வழங்கல் - Tree Plantation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .description {
            line-height: 1.6;
            background: #f2f9f4;
            padding: 15px;
            border-left: 4px solid #27ae60;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            overflow: hidden;
            padding: 10px;
        }
        .gallery-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>மரக்கன்றுகள் வழங்கும் நிகழ்வு</h1>
    <div class="description">
        <p>13.12.2021 அன்று நடைபெற்ற எங்கள் சங்கத்தின் 10-ஆம் ஆண்டு விழாவில், தமிழ்நாடு சுற்றுச்சூழல் துறை அமைச்சர் மற்றும் வாரியத் தலைவர் திரு. உதயன் (IFS) ஆகியோர், எங்கள் சங்கத்தின் ஏற்பாட்டின் கீழ் மரம் நடும் தன்னார்வலர்கள் 500 பேருக்கு மரக்கன்றுகளை வழங்கினர்.</p>
    </div>
    <div class="gallery">
        <div class="gallery-item"><img src="photos/tree_1.jpg" alt="Tree Plantation Event"></div>
        <div class="gallery-item"><img src="photos/tree_2.jpg" alt="Tree Plantation Event"></div>
    </div>
</div>

</body>
</html>
