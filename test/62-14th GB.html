<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14ஆம் ஆண்டு விழா - 14th Anniversary</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            overflow: hidden;
            padding: 10px;
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>சங்கத்தின 14 ஆம் ஆண்டு விழா (07.09.2025)</h1>
    <div class="gallery">
        <div class="gallery-item"><img src="photos/anniversary_14_1.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_2.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_3.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_4.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_5.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_6.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_7.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_8.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_9.jpg" alt="14th Anniversary Event"></div>
        <div class="gallery-item"><img src="photos/anniversary_14_10.jpg" alt="14th Anniversary Event"></div>
    </div>
</div>

</body>
</html>
